[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optaware-agent"
version = "0.1.0"
description = "AI-powered Linux server management agent"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "pydantic>=2.0",
    "click",
    "fastapi",
    "uvicorn",
    "httpx",
    "qdrant-client",
    "rich",
    "jinja2",
    "psutil",
    "watchdog",
]

[project.scripts]
optaware = "daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
