version: "3.8"

services:
  optaware:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: optaware-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /etc/optaware:/etc/optaware:ro
      - optaware-config:/data/config
      - optaware-logs:/data/logs
      - optaware-knowledge:/data/knowledge
      - optaware-backups:/data/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /run/systemd/journal:/run/systemd/journal:ro
    environment:
      - OPTAWARE_LLM_API_KEY=${OPTAWARE_LLM_API_KEY:-}
      - OPTAWARE_ENV=production
    networks:
      - optaware-net
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: optaware-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - optaware-net

volumes:
  optaware-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/config
  optaware-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/logs
  optaware-knowledge:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/knowledge
  optaware-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/backups
  qdrant-data:

networks:
  optaware-net:
    driver: bridge
